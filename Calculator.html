<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Standard Calculator</title>
<style>
body { display: flex;
       justify-content: center;
       align-items: center;
       height: 100vh;
       background-color: lightgrey; }
.calculator { background-color: black;
              padding: 20px;
              width: 280px;
              border-radius: 20px; }
#display { width: 100%;
       height: 60px;
       background-color: white;
       font-size: 30px;
       text-align: right;
       padding: 5px 10px;
       box-sizing: border-box;
       border: none;
       margin-bottom: 15px;
       color: black;
       border-radius: 20px; }
.buttons { display: grid;
           grid-template-columns: repeat(4, 1fr);
           gap: 10px;
           border-radius: 10px; }
button { padding: 15px;
         font-size: 20px;
         border: none;
         background-color: lightgrey;
         border-radius: 10px; }
button:hover { background-color: darkgrey; }
.operator { background-color: orange;
            color: white; }
.operator:hover { background-color: #ea580c; }
.span-two { grid-column: span 2; }
</style>
</head>
<body>
<div class="calculator">
<input type="text" id="display" readonly>
<div class="buttons">
<button class="operator" onclick="clearDisplay()">C</button>
<button class="operator" onclick="deleteChar()">DEL</button>
<button class="operator" onclick="appendCharacter('%')">%</button>
<button class="operator" onclick="appendCharacter('/')">/</button>

<button onclick="appendCharacter('7')">7</button>
<button onclick="appendCharacter('8')">8</button>
<button onclick="appendCharacter('9')">9</button>
<button class="operator" onclick="appendCharacter('*')">*</button>

<button onclick="appendCharacter('4')">4</button>
<button onclick="appendCharacter('5')">5</button>
<button onclick="appendCharacter('6')">6</button>
<button class="operator" onclick="appendCharacter('-')">-</button>

<button onclick="appendCharacter('1')">1</button>
<button onclick="appendCharacter('2')">2</button>
<button onclick="appendCharacter('3')">3</button>
<button class="operator" onclick="appendCharacter('+')">+</button>

<button onclick="appendCharacter('0')">0</button>
<button onclick="appendCharacter('.')">.</button>
<button class="operator span-two" onclick="calculateResult()">=</button>
</div></div>

<script>
const display = document.getElementById('display');
function appendCharacter(char) {
if (display.value === '0' && char !== '.') {
display.value = char;
} else {
display.value += char;
}
}

function clearDisplay() {
display.value = '0'; }

function deleteChar() {
display.value = display.value.slice(0, -1); }

function calculateResult() {
try {
let expression = display.value.replace(/%/g, '/100');
display.value = eval(expression);
} catch (error) {
display.value = 'Error';
}
}
</script>
</body>
</html>
