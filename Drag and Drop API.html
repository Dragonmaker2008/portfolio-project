<!DOCTYPE HTML>
<html>
<head>
<style>
body { font-family: 'Segoe UI', Arial, sans-serif; 
       padding: 20px; 
       color: #1e293b; }
#div1 {
  width: 360px; 
  height: 270px; 
  padding: 10px;
  border: 2px dashed #0f766e; 
  border-radius: 12px;
  background-color: #f0fdfa; 
  margin-bottom: 14px;
}
</style>
<script>
function dragstarthandler(ev) {ev.dataTransfer.setData("text",ev.target.id); }
function dragoverHandler(ev) {ev.preventDefault(); }
function dropHandler(ev) {ev.preventDefault(); const data=ev.dataTransfer.getData("text");
ev.target.appendChild(document.getElementById(data)); }
</script>
</head>
<body>
<h1> Drag and Drop API: </h1>
<p> Drag the gif in the rectangle </p>
<div id="div1" ondrop="dropHandler(event)" ondragover="dragoverHandler(event)"> </div>
<img id="img1" src="img_logo.gif" draggable="true" ondragstart="dragstarthandler(event)" width="340" height="250">
</body>
</html>
